<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>背单词</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section id="start" class="panel active">
      <h1>每日学习计划</h1>
      <div class="choices">
        <button data-count="30">每天 30 个</button>
        <button data-count="50">每天 50 个</button>
        <button data-count="80">每天 80 个</button>
      </div>
    </section>

    <section id="card" class="panel">
      <header class="top">
        <button id="prev">上一个</button>
        <button id="next">下一个</button>
      </header>
      <div id="card-root"></div>
      <footer class="actions">
        <button id="reveal">显示释义</button>
        <button id="example">显示例句</button>
      </footer>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
